name: CI

on:
  push:
    branches: [main, features, develop, map]
  pull_request:
    branches: [main, features, develop, map]

# CI tests ALWAYS use local Supabase (deterministic + safe).
# Do NOT put live project URLs/keys in this file — use GitHub Secrets for
# the production-build job and your host (Vercel/Netlify) env instead.
env:
  LOCAL_SUPABASE_URL: http://127.0.0.1:54321
  LOCAL_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Gitleaks (C-30 — no secrets in git)
        run: ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  quality:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Production dependency audit (zero critical)
        run: npm run audit:prod
      - name: Build (CI / local Supabase placeholders)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          VITE_APP_URL: http://127.0.0.1:4173

  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci
      - run: supabase start -x edge-runtime,imgproxy,logflare,vector
      - run: supabase db reset
      - run: npm run test:integration
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci
      - run: supabase start -x edge-runtime,imgproxy,logflare,vector
      - run: supabase db reset

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          VITE_APP_URL: http://127.0.0.1:4173

      - run: npm run preview -- --host 127.0.0.1 --port 4173 &
      - run: npx wait-on http://127.0.0.1:4173 --timeout 60000

      - run: npm run test:e2e
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:4173
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.LOCAL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          VITE_APP_URL: http://127.0.0.1:4173

      - run: npm run preview -- --host 127.0.0.1 --port 4173 &
      - run: npx wait-on http://127.0.0.1:4173 --timeout 60000

      - name: Lighthouse CI (C-29 ≥70 performance, FCP &lt;2.5s)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./.lighthouserc.cjs

  # Builds against the LIVE Supabase project using GitHub Secrets.
  # Add these in Repo → Settings → Secrets and variables → Actions:
  #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_APP_URL
  production-build:
    runs-on: ubuntu-latest
    needs: quality
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/map')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Require production secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
        run: |
          missing=0
          for key in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_APP_URL; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set. Add it under Settings → Secrets → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Build with live Supabase (production)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
          VITE_FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.VITE_FLUTTERWAVE_PUBLIC_KEY }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          VITE_CRYPTO_TREASURY_ADDRESS: ${{ secrets.VITE_CRYPTO_TREASURY_ADDRESS }}

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 7
