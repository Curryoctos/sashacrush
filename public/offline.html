<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f5c32" />
    <title>Offline · SashaCrush</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #0f5c32;
        --ink: #0b120e;
        --muted: #4a5a4f;
        --surface: #eef1ef;
        --panel: #ffffff;
        --border: #c9d2cb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 90% 55% at 0% -10%, #c8e9d4aa, transparent 55%),
          radial-gradient(ellipse 70% 45% at 100% 0%, #e8f6eeaa, transparent 50%),
          var(--surface);
      }
      main {
        width: min(100%, 26rem);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 12px 40px rgb(18 26 20 / 0.1);
      }
      .mark {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.65rem;
        background: #176539;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.25;
        font-family: 'Source Serif 4', 'Times New Roman', serif;
        font-weight: 700;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 0.7rem 1rem;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #147a3f;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SC</div>
      <h1>You’re offline</h1>
      <p>
        SashaCrush can’t reach the network right now. Cached screens may still open; reconnect
        to sync deals, payments, and chat.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
